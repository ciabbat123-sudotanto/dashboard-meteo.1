name: Aggiorna Dashboard Meteo

on:
  schedule:
    # Esegue ogni mattina alle 07:00 italiane (05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa pacchetti
        run: |
          pip install matplotlib requests pandas numpy

      - name: Esegui Script Meteo
        run: python script.py

      - name: Salva e Pubblica Immagine
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dashboard_meteo_ciabatta.png
          git commit -m "Auto-aggiornamento dashboard meteo" || exit 0
          git pushname: Aggiorna Dashboard Meteo

